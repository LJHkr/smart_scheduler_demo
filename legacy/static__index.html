<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>智能排班助手 Demo</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #162033;
      --muted: #64748b;
      --line: #dbe3ef;
      --panel: rgba(255, 255, 255, .9);
      --primary: #3157d5;
      --primary-dark: #2344b0;
      --ok: #087b50;
      --bad: #b42318;
      --bg: #eef3fb;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: Inter, "PingFang SC", "Microsoft YaHei", sans-serif;
      background:
        radial-gradient(circle at 10% 0%, #dce8ff 0, transparent 34%),
        radial-gradient(circle at 90% 10%, #e9dcff 0, transparent 30%),
        var(--bg);
    }
    .shell { width: min(1180px, calc(100% - 32px)); margin: 0 auto; padding: 42px 0 64px; }
    header { margin-bottom: 24px; }
    .eyebrow { color: var(--primary); font-weight: 700; letter-spacing: .08em; font-size: 13px; }
    h1 { margin: 8px 0; font-size: clamp(30px, 5vw, 48px); line-height: 1.08; }
    .subtitle { color: var(--muted); max-width: 760px; line-height: 1.7; }
    .panel {
      background: var(--panel);
      border: 1px solid rgba(255,255,255,.8);
      border-radius: 20px;
      box-shadow: 0 18px 50px rgba(34, 55, 95, .12);
      padding: 22px;
      backdrop-filter: blur(12px);
    }
    textarea {
      width: 100%; min-height: 112px; resize: vertical;
      border: 1px solid var(--line); border-radius: 14px; padding: 15px 16px;
      font: inherit; line-height: 1.6; color: var(--ink); background: #fff;
      outline: none;
    }
    textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(49,87,213,.1); }
    .actions { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-top: 14px; }
    button {
      border: 0; border-radius: 12px; padding: 12px 18px; cursor: pointer;
      background: var(--primary); color: white; font-weight: 700; font-size: 15px;
    }
    button:hover { background: var(--primary-dark); }
    button:disabled { opacity: .55; cursor: wait; }
    .example { color: var(--muted); font-size: 13px; }
    #status { margin: 22px 0 0; display: none; }
    .status-card { border-radius: 14px; padding: 14px 16px; font-weight: 650; }
    .status-card.ok { color: var(--ok); background: #e9f9f2; border: 1px solid #a8e6cc; }
    .status-card.bad { color: var(--bad); background: #fff0ed; border: 1px solid #ffc7bf; }
    .summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 18px 0; }
    .metric { padding: 15px; border: 1px solid var(--line); border-radius: 14px; background: #fff; }
    .metric strong { display: block; font-size: 25px; margin-top: 4px; }
    .metric span { color: var(--muted); font-size: 13px; }
    .table-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 14px; background: #fff; }
    table { border-collapse: collapse; width: 100%; min-width: 850px; }
    th, td { padding: 12px 13px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
    th { background: #f7f9fd; color: #44516a; font-size: 13px; }
    tr:last-child td { border-bottom: 0; }
    .tag { display: inline-block; margin: 2px 4px 2px 0; padding: 3px 8px; border-radius: 999px; background: #edf2ff; color: #3451ae; font-size: 12px; }
    h2 { margin-top: 30px; font-size: 20px; }
    .rules { display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; }
    .rule { border: 1px solid var(--line); background: #fff; border-radius: 12px; padding: 11px 12px; font-size: 14px; }
    .rule.pass { color: var(--ok); }
    .rule.fail { color: var(--bad); }
    .empty { color: var(--muted); padding: 30px 0 8px; text-align: center; }
    @media (max-width: 720px) {
      .summary, .rules { grid-template-columns: 1fr; }
      .shell { width: min(100% - 20px, 1180px); padding-top: 24px; }
      .panel { padding: 16px; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div class="eyebrow">SCENARIO C · WORKFORCE AGENT</div>
      <h1>智能排班助手</h1>
      <div class="subtitle">输入一句自然语言，系统生成合规排班，并独立检查店长值守、技能覆盖、人数、工时、连续工作、请假及晚班接早班等规则。</div>
    </header>

    <section class="panel">
      <label for="request"><strong>排班需求</strong></label>
      <textarea id="request">请生成下周完整排班，优先满足员工班次偏好并保持工作量均衡</textarea>
      <div class="actions">
        <button id="generate">生成并校验排班</button>
        <span class="example">也可输入：“只生成周末排班”或“生成工作日排班，不考虑偏好”</span>
      </div>
      <div id="status"></div>
      <div id="result"><div class="empty">等待生成排班</div></div>
    </section>
  </main>

  <script>
    const button = document.querySelector('#generate');
    const input = document.querySelector('#request');
    const statusBox = document.querySelector('#status');
    const resultBox = document.querySelector('#result');

    const escapeHtml = (value) => String(value)
      .replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;')
      .replaceAll('"', '&quot;').replaceAll("'", '&#039;');

    function showStatus(message, ok) {
      statusBox.style.display = 'block';
      statusBox.innerHTML = `<div class="status-card ${ok ? 'ok' : 'bad'}">${escapeHtml(message)}</div>`;
    }

    function render(data) {
      if (!data.success) {
        const details = (data.validation?.violations || [])
          .map(v => `<li><strong>${escapeHtml(v.rule)}</strong>：${escapeHtml(v.message)}</li>`).join('');
        showStatus(`未找到完全合规的方案：${data.error || '存在规则冲突'}`, false);
        resultBox.innerHTML = `<h2>冲突诊断</h2><ul>${details || '<li>暂无更多信息</li>'}</ul>
          <p>${escapeHtml(data.suggestion || '')}</p>`;
        return;
      }

      showStatus('已生成排班，R-01～R-09 全部通过独立校验。', true);
      const rows = data.schedule.map(item => {
        const people = item.employee_details.map(person =>
          `<span class="tag" title="${escapeHtml(person.skills.join('、'))}">${escapeHtml(person.id)} · ${escapeHtml(person.position)}</span>`
        ).join('');
        return `<tr>
          <td>${escapeHtml(item.day)}</td><td>${escapeHtml(item.shift)}</td><td>${escapeHtml(item.time)}</td>
          <td>${people}</td>
          <td>${item.coverage['店长值守']}</td><td>${item.coverage['饮品制作']}</td><td>${item.coverage['收银']}</td>
        </tr>`;
      }).join('');
      const rules = Object.entries(data.validation.rules).map(([id, item]) =>
        `<div class="rule ${item.passed ? 'pass' : 'fail'}">${item.passed ? '✓' : '✕'} ${escapeHtml(id)} ${item.passed ? '通过' : '失败'}</div>`
      ).join('');
      resultBox.innerHTML = `
        <div class="summary">
          <div class="metric"><span>班次数</span><strong>${data.statistics.total_shifts}</strong></div>
          <div class="metric"><span>人员安排数</span><strong>${data.statistics.total_assignments}</strong></div>
          <div class="metric"><span>规则通过</span><strong>9 / 9</strong></div>
        </div>
        <h2>排班结果</h2>
        <div class="table-wrap"><table>
          <thead><tr><th>日期</th><th>班次</th><th>时间</th><th>员工</th><th>店长值守</th><th>饮品制作</th><th>收银</th></tr></thead>
          <tbody>${rows}</tbody>
        </table></div>
        <h2>规则校验</h2><div class="rules">${rules}</div>`;
    }

    button.addEventListener('click', async () => {
      const request = input.value.trim();
      if (!request) { showStatus('请输入排班需求。', false); return; }
      button.disabled = true;
      button.textContent = '正在生成…';
      statusBox.style.display = 'none';
      resultBox.innerHTML = '<div class="empty">正在求解并校验，请稍候…</div>';
      try {
        const response = await fetch('/api/schedule', {
          method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({request})
        });
        const data = await response.json();
        if (!response.ok) throw new Error(data.error || '请求失败');
        render(data);
      } catch (error) {
        showStatus(error.message, false);
        resultBox.innerHTML = '<div class="empty">请检查 Python 服务是否正常运行。</div>';
      } finally {
        button.disabled = false;
        button.textContent = '生成并校验排班';
      }
    });
  </script>
</body>
</html>
